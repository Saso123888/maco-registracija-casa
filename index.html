function allowedTypes(){let mode=settings.admin_mode||'LIGHT';if(mode==='LIGHT')return types.filter(x=>['PRIHOD','ODHOD'].includes(x.code));let l=locationForUser(),enabledUser=userTypes.filter(x=>x.enabled).map(x=>String(x.registration_type_id)),enabledLoc=locTypes.filter(x=>String(x.location_id)===String(l?.id)&&x.enabled).map(x=>String(x.registration_type_id));return types.filter(x=>(!enabledUser.length||enabledUser.includes(String(x.id)))&&(!enabledLoc.length||enabledLoc.includes(String(x.id))))}
function show(v){['home','records','profile','confirmView'].forEach(x=>$(x).classList.toggle('hidden',x!==v));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='home')renderHome();if(v==='records')renderRecords();if(v==='profile')renderProfile()}
function renderHome(){let l=locationForUser(),sh=detectShift(new Date(),l);detected=sh;$('home').innerHTML=`<div class="hero"><div class="clock" id="clock">${new Date().toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'})}</div><h2>${esc((me.first_name||'')+' '+(me.last_name||''))}</h2><div class="meta"><div>${tr('location')}<br><b>${esc(l?.name||'Ni dodeljena')}</b></div><div>${tr('shift')}<br><b>${esc(sh?.name||'Ni zaznana')}</b></div></div></div><div id="homeMsg"></div><div class="card"><h3>Izberi registracijo</h3><div class="primary-events">${allowedTypes().filter(t=>['PRIHOD','ODHOD'].includes(t.code)).map(t=>`<button class="event ${esc(t.code)}" data-type="${t.id}">${esc(typeLabel(t))}</button>`).join('')}</div>${allowedTypes().filter(t=>!['PRIHOD','ODHOD'].includes(t.code)).length?`<button id="extraToggle" class="extra-toggle" type="button"><span>＋ Dodatne vrste registracije</span><span class="chev">⌄</span></button><div id="extraTypes" class="extra-types hidden"><div class="extra-events">${allowedTypes().filter(t=>!['PRIHOD','ODHOD'].includes(t.code)).map(t=>`<button class="event ${esc(t.code)}" data-type="${t.id}">${esc(typeLabel(t))}</button>`).join('')}</div></div>`:''}</div><div class="card"><div class="status"><span class="pill ${l?'ok':'err'}">${l?'✓ Poslovalnica':'! Brez lokacije'}</span><span class="pill ${sh?'ok':'warn'}">${sh?'✓ Izmena '+sh.no:'! Izmena ni zaznana'}</span><span id="gpsPill" class="pill warn">GPS še ni zajet</span></div></div>`;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>prepareRegistration(b.dataset.type));if($('extraToggle'))$('extraToggle').onclick=()=>{$('extraTypes').classList.toggle('hidden');$('extraToggle').classList.toggle('open')};tickClock()}
function typeLabel(t){let m={PRIHOD:{SL:'Prihod',EN:'Arrival',HR:'Dolazak'},ODHOD:{SL:'Odhod',EN:'Departure',HR:'Odlazak'}};return m[t.code]?.[lang]||t.name}
function tickClock(){let c=$('clock');if(c)c.textContent=new Date().toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'})}
function detectShift(now,l){if(!l)return null;let jsDay=now.getDay(),wd=jsDay===0?7:jsDay,date=now.toISOString().slice(0,10),useIndividual=me.work_schedule_mode==='INDIVIDUAL'||me.use_location_schedule===false,cands=[];let sp=specialDays.find(x=>String(x.location_id)===String(l.id)&&x.special_date===date);if(sp)cands=specialShifts.filter(x=>String(x.special_day_id)===String(sp.id));else{let weekly=useIndividual?userWeekShifts.filter(x=>x.user_id===me.id&&x.weekday===wd&&x.active):weekShifts.filter(x=>String(x.location_id)===String(l.id)&&x.weekday===wd&&x.active);if(weekly.length)cands=weekly;else cands=useIndividual?userShifts.filter(x=>x.user_id===me.id&&x.active):locShifts.filter(x=>String(x.location_id)===String(l.id)&&x.active)}if(!cands.length)return null;let min=now.getHours()*60+now.getMinutes(),best=null;for(let s of cands){let [h,m]=String(s.start_time).split(':').map(Number),start=h*60+m,d=Math.abs(min-start);d=Math.min(d,1440-d);if(!best||d<best.d)best={s,d}}return best?{...best.s,no:best.s.shift_no,name:best.s.shift_name||'Izmena '+best.s.shift_no}:null}
function hav(a,b,c,d){let R=6371000,z=x=>x*Math.PI/180,p1=z(a),p2=z(c),dp=z(c-a),dl=z(d-b),q=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function toast(msg,kind='ok',ms=3200){let t=$('toast');if(!t)return;t.className='toast '+kind+' show';t.textContent=msg;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.remove('show'),ms)}
function getGps(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(Error('GPS ni podprt.'));let done=false,t=setTimeout(()=>{if(!done){done=true;rej(Error('Čas za pridobitev GPS je potekel'))}},12000);navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy})},e=>{if(done)return;done=true;clearTimeout(t);rej(Error(e.message||'GPS dovoljenje ni na voljo'))},{enableHighAccuracy:false,timeout:10000,maximumAge:60000})})}
const CONTROL_MODES=['NONE','WARN','BLOCK'];
function timeCheck(sh){if(!sh)return{ok:true,msg:''};let now=new Date(),m=now.getHours()*60+now.getMinutes(),[h,mi]=String(sh.start_time).split(':').map(Number),start=h*60+mi,early=sh.early_arrival_minutes??30,late=60,d=m-start;if(d>720)d-=1440;if(d< -720)d+=1440;let ok=d>=-early&&d<=late;return{ok,msg:ok?'':'Registracija je izven pričakovanega časovnega okna.'}}
async function prepareRegistration(typeId){let t=types.find(x=>String(x.id)===String(typeId)),l=locationForUser(),mode=me.time_control_mode||'WARN';$('homeMsg').className='msg warn';$('homeMsg').textContent='Pridobivam GPS lokacijo ...';try{if(t.enforce_location===false||t.remote_mode){try{gps=await getGps()}catch{gps=null}}else{gps=await getGps()}let distance=(gps&&l?.latitude&&l?.longitude)?hav(gps.lat,gps.lon,Number(l.latitude),Number(l.longitude)):null,radius=me.allowed_radius_m||l?.allowed_radius_m||settings.default_radius_m||200,gpsOk=t.enforce_location===false||t.remote_mode||distance===null||distance<=radius,tc=timeCheck(detected);$('homeMsg').textContent='';$('homeMsg').className='';$('gpsPill')?.classList.remove('warn');if($('gpsPill')){$('gpsPill').classList.add(gpsOk?'ok':'err');$('gpsPill').textContent=gps?(distance!==null?Math.round(distance)+' m / '+radius+' m':'GPS zajet'):'GPS ni zajet'}if(!gpsOk&&mode==='BLOCK')throw Error(tr('outside'));if(!tc.ok&&mode==='BLOCK')throw Error(tr('timewarn'));let warnings=[];if(!gpsOk)warnings.push(tr('outside'));if(!tc.ok)warnings.push(tr('timewarn'));if(!l)warnings.push('Uporabniku poslovalnica še ni dodeljena.');confirmRegistration(t,l,distance,gpsOk,warnings)}catch(e){$('homeMsg').className='msg err';$('homeMsg').innerHTML='<b>GPS lokacije ni bilo mogoče pridobiti.</b><br>'+esc(e.message||e)+'<div class="gps-help">Na iPhonu/iPadu preveri Nastavitve → Zasebnost in varnost → Lokacijske storitve ter dovoljenje za brskalnik. Nato osveži stran in poskusi ponovno.</div>';toast('GPS ni na voljo. Preveri dovoljenje za lokacijo.','err',4500)}}
function confirmRegistration(t,l,distance,gpsOk,warnings){let now=new Date(),isOut=t.code==='ODHOD';$('home').classList.add('hidden');$('records').classList.add('hidden');$('profile').classList.add('hidden');$('confirmView').classList.remove('hidden');document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active'));$('confirmView').innerHTML=`<div class="confirm-page"><div class="confirm-topbar"><button id="confirmBack" class="confirm-back">← Nazaj</button><b>MACO · POTRDITEV</b></div><div class="confirm-page-card"><span class="confirm-badge ${isOut?'out':''}">${esc(typeLabel(t))}</span><h2 style="margin:10px 0 2px">Preveri registracijo</h2><div class="small">Prvi ekran je skrit. Pred shranjevanjem preveri podatke.</div>${warnings.length?`<div class="confirm-alert">${warnings.map(esc).join('<br>')}</div>`:''}<div class="confirm-data"><div class="confirm-data-item"><span>Datum</span><b>${now.toLocaleDateString('sl-SI')}</b></div><div class="confirm-data-item"><span>Ura</span><b>${now.toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'})}</b></div><div class="confirm-data-item"><span>${tr('location')}</span><b>${esc(l?.name||'-')}</b></div><div class="confirm-data-item"><span>${tr('shift')}</span><b>${esc(detected?.name||'-')}</b></div><div class="confirm-data-item" style="grid-column:1/-1"><span>GPS</span><b>${gps?gps.lat.toFixed(6)+', '+gps.lon.toFixed(6):'ni zajet'}${distance!==null?' · '+Math.round(distance)+' m':''}</b></div></div></div><div class="confirm-page-actions"><button id="cancelConfirm" class="btn secondary">Zavrni</button><button id="saveConfirm" class="btn confirm-page-save ${isOut?'out':''}">Potrdi</button></div><div id="confirmError"></div></div>`;window.scrollTo(0,0);$('confirmBack').onclick=()=>show('home');$('cancelConfirm').onclick=()=>show('home');$('saveConfirm').onclick=()=>saveRegistration(t,l,distance,gpsOk)}
async function saveRegistration(t,l,distance,gpsOk){try{let now=new Date(),body={user_id:me.id,created_by:me.id,entry_date:now.toISOString().slice(0,10),entry_time:now.toTimeString().slice(0,8),entry_type:t.code,registration_type_id:t.id,location_id:l?.id||null,gps_latitude:gps?.lat||null,gps_longitude:gps?.lon||null,gps_distance_m:distance===null?null:Math.round(distance*100)/100,location_check_passed:gpsOk,detected_shift_no:detected?.no||null,approval_status:t.requires_approval?'PENDING':'APPROVED',source:'mobile'};await api('/rest/v1/time_entries',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});await loadEntries();show('home');$('homeMsg').className='msg ok';$('homeMsg').innerHTML='<b>✓ '+esc(tr('saved'))+'</b><br><span class="small">'+esc(typeLabel(t))+' · '+new Date().toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'})+'</span>';toast('✓ '+tr('saved'),'ok',4200)}catch(e){let m=String(e.message||e),friendly=m.includes('created_by')?'Registracije ni bilo mogoče shraniti zaradi manjkajočega podatka o uporabniku.':m.includes('row-level security')?'Za zapis registracije ni ustrezne pravice. Obrni se na administratorja.':m;$('confirmError').innerHTML=`<div class="msg err">${esc(friendly)}</div>`}}
function renderRecords(){$('records').innerHTML=`<div class="card"><h2>${tr('records')}</h2><div class="list">${entries.map(e=>`<div class="row"><div><strong>${fmtDate(e.entry_date)}</strong><div class="small">${String(e.entry_time||'').slice(0,5)}</div></div><div><strong>${esc(types.find(t=>String(t.id)===String(e.registration_type_id))?.name||e.entry_type)}</strong><div class="small">${esc(locations.find(l=>String(l.id)===String(e.location_id))?.name||'-')}</div></div><span class="pill ${e.location_check_passed===false?'warn':'ok'}">${e.approval_status||'OK'}</span></div>`).join('')||'<p class="small">Ni zapisov.</p>'}</div></div>`}
function fmtDate(v){return v?new Date(v+'T00:00:00').toLocaleDateString('sl-SI'):'-'}
function renderProfile(){let l=locationForUser();$('profile').innerHTML=`<div class="card"><h2>${tr('profile')}</h2><p><b>${esc((me.first_name||'')+' '+(me.last_name||''))}</b><br>@${esc(me.username||'')}</p><hr style="border:0;border-top:1px solid var(--line)"><p>${tr('location')}: <b>${esc(l?.name||'-')}</b><br>Dnevna norma: <b>${me.daily_work_minutes||480} min</b><br>Število izmen: <b>${me.shift_count||1}</b><br>Kontrola: <b>${esc(me.time_control_mode||'WARN')}</b><br>Jezik: <b>${lang}</b></p></div>`}
$('loginForm').onsubmit=login;$('cancelModal').onclick=()=>{};$('logout').onclick=()=>{localStorage.removeItem('maco_time_session');sessionStorage.removeItem('maco_time_session');location.reload()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));restore();setInterval(tickClock,30000);
</script></body></html>
