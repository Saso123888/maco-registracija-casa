<!doctype html><html lang='sl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>MACO Evidenca časa</title><style>
:root{--blue:#0877bd;--dark:#173042;--bg:#eef5f8;--green:#16a36a;--red:#df4b4b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(145deg,#e9f4f8,#fff);color:var(--dark)}.app{max-width:480px;margin:auto;min-height:100vh;padding:24px}.brand{text-align:center;margin:20px 0 28px}.logo{font-size:46px;font-weight:900;letter-spacing:-3px;color:var(--blue)}.sub{color:#607887}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 14px 40px #18394b22}.field{margin:14px 0}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}input,button,select{width:100%;padding:15px;border-radius:13px;border:1px solid #cddce4;font-size:16px}button{border:0;background:var(--blue);color:white;font-weight:800;cursor:pointer;margin-top:12px}.ghost{background:#eaf4fa;color:var(--blue)}.ok{background:var(--green)}.out{background:var(--red)}.hidden{display:none}.pill{background:#eaf4fa;padding:10px 14px;border-radius:12px;margin:10px 0;font-size:14px}.status{text-align:center;font-weight:700;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiny{font-size:12px;color:#6d7e87;text-align:center;margin-top:15px}@media(max-width:360px){.app{padding:14px}.card{padding:18px}.row{grid-template-columns:1fr}}
</style></head><body><main class='app'><div class='brand'><div class='logo'>MACO</div><div class='sub'>Evidenca delovnega časa</div></div>
<section id='login' class='card'><h2>Prijava</h2><div class='field'><label>Uporabniško ime</label><input id='u' value='demo'></div><div class='field'><label>Geslo</label><input id='p' type='password' value='demo'></div><label style='display:flex;gap:8px;align-items:center;font-weight:400'><input id='remember' type='checkbox' checked style='width:auto'> Zapomni si me</label><button onclick='login()'>Prijava</button><div class='tiny'>Demo prijava: demo / demo</div></section>
<section id='clock' class='card hidden'><h2>Registracija časa</h2><div class='pill'>Uporabnik: <b>Demo uporabnik</b></div><div class='pill'>Delovno mesto: <b id='place'>še ni izbrano</b></div><button onclick='scan()'>Skeniraj QR delovnega mesta</button><button class='ghost' onclick='skip()'>Preskoči skeniranje (demo)</button><div id='scanStatus' class='status'>Najprej skeniraj ali preskoči QR.</div><div id='actions' class='hidden'><div class='row'><button class='ok' onclick="stamp('PRIHOD')">PRIHOD</button><button class='out' onclick="stamp('ODHOD')">ODHOD</button></div></div><div id='result' class='pill hidden'></div><button class='ghost' onclick='logout()'>Odjava</button></section></main><script>
function login(){if(u.value==='demo'&&p.value==='demo'){loginEl().classList.add('hidden');document.getElementById('clock').classList.remove('hidden')}else alert('Za demo uporabi demo / demo.')} function loginEl(){return document.getElementById('login')} function enable(place){document.getElementById('place').textContent=place;document.getElementById('scanStatus').textContent='Delovno mesto potrjeno.';document.getElementById('actions').classList.remove('hidden')} function skip(){enable('MACO d.o.o. - demo lokacija')} function scan(){alert('Demo: skeniranje je dovoljeno preskočiti. V produkciji tukaj aktiviramo kamero in QR čitalnik.');enable('MACO d.o.o. - QR demo')} function stamp(type){let loc='GPS ni dovoljen / ni na voljo';let done=()=>{let d=new Date();let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<b>'+type+'</b><br>'+d.toLocaleString('sl-SI')+'<br>'+loc};if(navigator.geolocation)navigator.geolocation.getCurrentPosition(x=>{loc=x.coords.latitude.toFixed(5)+', '+x.coords.longitude.toFixed(5);done()},()=>done(),{timeout:4000});else done()} function logout(){document.getElementById('clock').classList.add('hidden');loginEl().classList.remove('hidden')}
</script></body></html>
