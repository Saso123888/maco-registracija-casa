/* MACO REG 4.2 - one DOM, one visual system, size only changes */
:root{--content-max:1040px}
.shell{width:100%;max-width:var(--content-max)!important;margin:0 auto!important;min-height:100dvh!important;padding:0!important}
#appView{width:100%!important}
.top{width:100%!important}
#home,#records,#reports,#profile,#confirmView{width:100%!important;box-sizing:border-box!important}
/* phone */
@media (max-width:699px){
 .shell{max-width:none!important}
 #home{min-height:calc(100dvh - 68px)!important;padding:18px 13px 100px!important;border-radius:0!important}
 .primary-events{grid-template-columns:1fr 1fr!important;gap:9px!important}
 .extra-events{grid-template-columns:1fr 1fr!important;gap:9px!important}
 .event{min-height:105px!important;font-size:18px!important}
 #records,#reports,#profile,#confirmView{min-height:calc(100dvh - 68px)!important;padding:16px 12px 96px!important;border-radius:0!important}
 .report-stats{grid-template-columns:1fr 1fr!important}
 .date-filters{grid-template-columns:1fr 1fr!important}
 .date-filters .btn{grid-column:1/-1!important}
 .confirm-line{grid-template-columns:110px 1fr!important}
 .nav{width:calc(100% - 16px)!important;bottom:8px!important}
}
/* tablet - same artwork/layout as phone, only larger dimensions */
@media (min-width:700px) and (max-width:1180px){
 body{background:#dfece6!important}
 .shell{width:calc(100% - 32px)!important;max-width:980px!important;margin:16px auto!important}
 .top{border-radius:20px 20px 0 0!important;margin:0!important;padding:18px 24px!important}
 #home{min-height:calc(100dvh - 120px)!important;padding:36px 40px 120px!important;border-radius:0 0 22px 22px!important;background-size:cover!important;background-position:center!important}
 #home .hero{max-width:760px!important}
 #home>.card{max-width:760px!important;margin:24px auto 0!important;padding:26px!important}
 .primary-events{grid-template-columns:1fr 1fr!important;gap:18px!important}
 .extra-events{grid-template-columns:1fr 1fr!important;gap:14px!important}
 .event{min-height:150px!important;font-size:24px!important;border-radius:20px!important}
 #records,#reports,#profile,#confirmView{min-height:calc(100dvh - 120px)!important;padding:34px 40px 120px!important;border-radius:0 0 22px 22px!important}
 .mock-head,.record-filters,.date-filters,#recList,.report-stats,#reports>.card,.confirm-page{max-width:820px!important;margin-left:auto!important;margin-right:auto!important}
 .report-stats{grid-template-columns:repeat(4,1fr)!important}
 .confirm-page{max-width:720px!important}
 .confirm-line{grid-template-columns:160px 1fr!important;font-size:15px!important}
 .nav{width:min(760px,calc(100% - 80px))!important;bottom:18px!important}
}
/* desktop */
@media (min-width:1181px){
 .shell{max-width:1080px!important;margin:24px auto!important}
 #home{min-height:760px!important;padding:44px 50px 120px!important;border-radius:0 0 24px 24px!important}
 #home>.card{max-width:820px!important;margin:28px auto 0!important;padding:28px!important}
 .event{min-height:150px!important;font-size:24px!important}
 #records,#reports,#profile,#confirmView{min-height:760px!important;padding:38px 48px 120px!important}
 .nav{width:760px!important}
}

function confirmRegistration(t,l,distance,gpsOk,warnings){let now=new Date(),out=t.code==='ODHOD';$('confirmView').innerHTML=`<div class="mock-head"><div><div class="title">MACO</div><div class="sub">Evidenca delovnega časa</div></div><button id="confirmBack" class="btn secondary">← Nazaj</button></div><div class="confirm-page"><div class="confirm-card"><span class="confirm-badge ${out?'out':''}">${esc(typeLabel(t))}</span><h2>Preveri registracijo</h2>${warnings.length?`<div class="msg warn">${warnings.map(esc).join('<br>')}</div>`:''}<div class="confirm-line"><span>Datum</span><b>${now.toLocaleDateString('sl-SI')}</b></div><div class="confirm-line"><span>Ura</span><b>${now.toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</b></div><div class="confirm-line"><span>Lokacija</span><b>${esc(l?.name||'-')}</b></div><div class="confirm-line"><span>GPS koordinate</span><b>${gps?gps.lat.toFixed(6)+', '+gps.lon.toFixed(6):'ni zajet'}</b></div><div class="confirm-line"><span>Natančnost</span><b>${gps?.accuracy?'± '+Math.round(gps.accuracy)+' m':'-'}</b></div><div class="confirm-actions"><button id="rejectConfirm" class="btn secondary">Zavrni</button><button id="saveConfirm" class="btn">Potrdi registracijo</button></div><div id="confirmError"></div></div></div>`;show('confirmView');window.scrollTo(0,0);$('confirmBack').onclick=()=>show('home');$('rejectConfirm').onclick=()=>show('home');$('saveConfirm').onclick=()=>saveRegistration(t,l,distance,gpsOk)}
async function saveRegistration(t,l,distance,gpsOk){try{let now=new Date(),body={user_id:me.id,created_by:me.id,entry_date:now.toISOString().slice(0,10),entry_time:now.toTimeString().slice(0,8),entry_type:t.code,registration_type_id:t.id,location_id:l?.id||null,gps_latitude:gps?.lat||null,gps_longitude:gps?.lon||null,gps_distance_m:distance===null?null:Math.round(distance*100)/100,location_check_passed:gpsOk,detected_shift_no:detected?.no||null,approval_status:t.requires_approval?'PENDING':'APPROVED',source:'mobile'};await api('/rest/v1/time_entries',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)});await loadEntries();show('home');$('homeMsg').className='msg ok';$('homeMsg').innerHTML='<b>✓ '+esc(tr('saved'))+'</b><br><span class="small">'+esc(typeLabel(t))+' · '+new Date().toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit'})+'</span>';toast('✓ '+tr('saved'),'ok',4200)}catch(e){let m=String(e.message||e),friendly=m.includes('created_by')?'Registracije ni bilo mogoče shraniti zaradi manjkajočega podatka o uporabniku.':m.includes('row-level security')?'Za zapis registracije ni ustrezne pravice. Obrni se na administratorja.':m;$('confirmError').innerHTML=`<div class="msg err">${esc(friendly)}</div>`}}
