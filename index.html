<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MACO Admin</title>
<style>
:root{--nav:#123f58;--blue:#0e86c8;--blue2:#0b6ea8;--bg:#edf4f7;--card:#fff;--text:#17384a;--muted:#66808e;--line:#dce7ec;--red:#d74646;--green:#159a60;--amber:#d58b12}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.top{height:68px;background:linear-gradient(100deg,var(--nav),#0c6da4);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-size:25px;font-weight:900}.brand span{color:#60c7ff}.top-user{font-size:14px}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}aside{background:var(--nav);padding:18px 12px;color:#fff}.menu{display:grid;gap:7px}.menu button{border:0;background:transparent;color:#fff;text-align:left;padding:13px 14px;border-radius:10px;cursor:pointer;font-weight:700}.menu button.active,.menu button:hover{background:#ffffff1f}.main{padding:22px;min-width:0}.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 8px 28px #17384a12;margin-bottom:18px}.login-wrap{max-width:540px;margin:7vh auto;padding:20px}.login-logo{text-align:center;font-size:44px;font-weight:900;color:var(--blue)}h1,h2,h3{margin:0 0 15px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #c8d9e2;border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.btn:hover{background:var(--blue2)}.btn.secondary{background:#e7f1f6;color:#155272}.btn.danger{background:var(--red)}.btn.green{background:var(--green)}.btn.amber{background:var(--amber)}.login-btn{width:100%;margin-top:15px;padding:14px}.msg{margin-top:12px;min-height:20px}.error{color:#b42318}.success{color:#137a4b}.stats{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:12px}.stat{background:#fff;border-radius:16px;padding:17px;box-shadow:0 5px 18px #17384a0e}.stat b{display:block;font-size:29px;color:var(--blue);margin-top:7px}.filters{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;align-items:end}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f3f8fa;position:sticky;top:0}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8f4fa;color:#14618b;font-weight:800}.entry-cards{display:none}.entry-card{border:1px solid var(--line);border-radius:13px;padding:14px;margin:10px 0;background:#fff}.entry-card .head{display:flex;justify-content:space-between;gap:8px}.entry-card dl{display:grid;grid-template-columns:110px 1fr;gap:7px;margin:12px 0;font-size:13px}.entry-card dt{font-weight:800}.entry-card dd{margin:0}.modal{position:fixed;inset:0;background:#071c28aa;display:grid;place-items:center;padding:15px;z-index:50}.modal-box{background:#fff;border-radius:18px;padding:20px;width:min(680px,100%);max-height:92vh;overflow:auto}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.report-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.report-summary div{background:#edf6fa;padding:14px;border-radius:12px}.empty{text-align:center;color:var(--muted);padding:28px}.mobile-menu{display:none}.print-title{display:none}
@media(max-width:900px){.shell{display:block}.top{padding:0 14px}.mobile-menu{display:block;border:0;background:#ffffff1f;color:#fff;padding:9px 11px;border-radius:8px}aside{display:none;position:fixed;left:0;right:0;top:68px;z-index:30}.shell.menu-open aside{display:block}.main{padding:12px}.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.top-user{display:none}.table-wrap{display:none}.entry-cards{display:block}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.report-summary{grid-template-columns:1fr 1fr}}
@media(max-width:460px){.stats,.filters,.report-summary{grid-template-columns:1fr}.brand{font-size:20px}}
@media print{body{background:#fff}.top,aside,.mobile-menu,.no-print,.actions,.filters{display:none!important}.shell{display:block}.main{padding:0}.card{box-shadow:none;border-radius:0;padding:0}.print-title{display:block;margin-bottom:18px}.table-wrap{display:block!important;border:0}table{min-width:0}th,td{font-size:10px;padding:6px}.entry-cards{display:none!important}}
</style></head>
<body>
<section id="loginPage" class="login-wrap"><div class="card"><div class="login-logo">MACO</div><h1 style="text-align:center">Administratorska prijava</h1><form id="loginForm"><div class="field"><label>Uporabniško ime</label><input id="loginUser" value="admin" autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Geslo</label><input id="loginPass" type="password" value="admin1234" autocomplete="current-password"></div><button class="btn login-btn">Prijava</button></form><div id="loginMsg" class="msg"></div></div></section>
<section id="adminPage" class="hidden"><header class="top"><button id="menuBtn" class="mobile-menu">☰</button><div class="brand"><span>MACO</span> ADMIN</div><div id="topUser" class="top-user"></div></header><div id="shell" class="shell"><aside><nav class="menu"><button data-page="dashboard" class="active">Nadzorna plošča</button><button data-page="entries">Evidenca časa</button><button data-page="users">Uporabniki</button><button data-page="reports">Poročila</button><button data-page="audit">Sledljivost</button><button id="logoutBtn">Odjava</button></nav></aside><main class="main"><div id="view"></div></main></div></section>
<div id="modal" class="modal hidden"><div class="modal-box"><div style="display:flex;justify-content:space-between;gap:10px"><h2 id="modalTitle">Zapis</h2><button id="closeModal" class="btn secondary">Zapri</button></div><div id="modalBody"></div></div></div>
<script>
(()=>{'use strict';
const BASE='https://gjtenghgidthqmhehxjx.supabase.co';const APIKEY='sb_publishable_msTthlKSK_D8GwxCzh5AEA_FkBak2pM';let token='',me=null,profiles=[],locations=[],entries=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function headers(){return {'apikey':APIKEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'}}async function req(path,opt={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);try{const r=await fetch(BASE+path,{...opt,headers:{...headers(),...(opt.headers||{})},signal:c.signal});const txt=await r.text();let d={};try{d=txt?JSON.parse(txt):{}}catch{d={message:txt}}if(!r.ok)throw Error(d.msg||d.message||d.error_description||'HTTP '+r.status);return d}finally{clearTimeout(t)}}
async function login(e){e.preventDefault();$('loginMsg').textContent='Prijavljam ...';try{let u=$('loginUser').value.trim(),email=u.includes('@')?u:u+'@maco.si';let a=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:$('loginPass').value})});token=a.access_token;let p=await req('/rest/v1/profiles?id=eq.'+a.user.id+'&select=*');if(!p[0]||p[0].role!=='admin')throw Error('Uporabnik nima administratorskih pravic.');me=p[0];$('loginPage').classList.add('hidden');$('adminPage').classList.remove('hidden');$('topUser').textContent=me.first_name+' '+me.last_name;await loadBase();showPage('dashboard')}catch(x){$('loginMsg').className='msg error';$('loginMsg').textContent='Napaka: '+x.message}}
async function loadBase(){[profiles,locations,entries]=await Promise.all([req('/rest/v1/profiles?select=*&order=last_name.asc'),req('/rest/v1/work_locations?select=*&order=name.asc'),req('/rest/v1/time_entries?select=*&order=entry_date.desc,entry_time.desc')])}
function showPage(p){document.querySelectorAll('.menu [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('shell').classList.remove('menu-open');({dashboard,entries:entriesPage,users:usersPage,reports,audit}[p]||dashboard)()}
function dashboard(){let today=new Date().toLocaleDateString('en-CA'),te=entries.filter(x=>!x.deleted&&x.entry_date===today);$('view').innerHTML=`<h1>Nadzorna plošča</h1><div class="stats"><div class="stat">Današnji prihodi<b>${te.filter(x=>x.entry_type==='PRIHOD').length}</b></div><div class="stat">Današnji odhodi<b>${te.filter(x=>x.entry_type==='ODHOD').length}</b></div><div class="stat">Na dopustu<b>${te.filter(x=>x.entry_type==='DOPUST').length}</b></div><div class="stat">Na bolniški<b>${te.filter(x=>x.entry_type==='BOLNISKA').length}</b></div><div class="stat">Aktivni uporabniki<b>${profiles.filter(x=>x.active).length}</b></div></div>`}
function profileName(id){let p=profiles.find(x=>x.id===id);return p?p.first_name+' '+p.last_name:id}function filtered(){let a=entries.filter(x=>!x.deleted),f=$('fFrom')?.value,t=$('fTo')?.value,u=$('fUser')?.value,ty=$('fType')?.value,l=$('fLoc')?.value;if(f)a=a.filter(x=>x.entry_date>=f);if(t)a=a.filter(x=>x.entry_date<=t);if(u)a=a.filter(x=>x.user_id===u);if(ty)a=a.filter(x=>x.entry_type===ty);if(l)a=a.filter(x=>x.work_location_id===l);return a}
function filtersHtml(){return `<div class="filters no-print"><div class="field"><label>Datum od</label><input id="fFrom" type="date"></div><div class="field"><label>Datum do</label><input id="fTo" type="date"></div><div class="field"><label>Uporabnik</label><select id="fUser"><option value="">Vsi</option>${profiles.map(p=>`<option value="${p.id}">${esc(p.first_name+' '+p.last_name)}</option>`).join('')}</select></div><div class="field"><label>Vrsta</label><select id="fType"><option value="">Vse</option>${['PRIHOD','ODHOD','DOPUST','BOLNISKA','NADURNO_DELO','SLUZBENA_POT','DRUGO'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Delovno mesto</label><select id="fLoc"><option value="">Vsa</option>${locations.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></div>`}
function entriesPage(){ $('view').innerHTML=`<h1>Evidenca časa</h1><div class="card">${filtersHtml()}<div class="actions no-print"><button id="searchBtn" class="btn">Filtriraj</button><button id="clearBtn" class="btn secondary">Počisti</button><button id="addBtn" class="btn green">+ Dodaj zapis</button><button class="btn amber" onclick="window.print()">Natisni</button></div><div id="entryResults"></div></div>`;$('searchBtn').onclick=renderEntries;$('clearBtn').onclick=()=>{['fFrom','fTo','fUser','fType','fLoc'].forEach(id=>$(id).value='');renderEntries()};$('addBtn').onclick=()=>openEntry();renderEntries()}
function renderEntries(){let a=filtered(),rows=a.map(x=>`<tr><td>${esc(x.entry_number)}</td><td>${esc(profileName(x.user_id))}</td><td>${x.entry_date}</td><td>${x.entry_time||''}</td><td><span class="badge">${x.entry_type}</span></td><td>${esc(x.qr_location_name||'')}</td><td>${x.gps_latitude||''} ${x.gps_longitude||''}</td><td class="no-print"><button class="btn secondary" onclick="window.editEntry('${x.id}')">Uredi</button> <button class="btn danger" onclick="window.deleteEntry('${x.id}')">Izbriši</button></td></tr>`).join('');let cards=a.map(x=>`<article class="entry-card"><div class="head"><b>${esc(profileName(x.user_id))}</b><span class="badge">${x.entry_type}</span></div><dl><dt>Datum</dt><dd>${x.entry_date} ${x.entry_time||''}</dd><dt>ID</dt><dd>${esc(x.entry_number)}</dd><dt>Lokacija</dt><dd>${esc(x.qr_location_name||'-')}</dd><dt>GPS</dt><dd>${x.gps_latitude||'-'} ${x.gps_longitude||''}</dd></dl><button class="btn secondary" onclick="window.editEntry('${x.id}')">Uredi</button> <button class="btn danger" onclick="window.deleteEntry('${x.id}')">Izbriši</button></article>`).join('');$('entryResults').innerHTML=a.length?`<div class="print-title"><h2>MACO Evidenca časa</h2></div><div class="table-wrap"><table><tr><th>ID</th><th>Uporabnik</th><th>Datum</th><th>Čas</th><th>Vrsta</th><th>Lokacija</th><th>GPS</th><th class="no-print">Dejanja</th></tr>${rows}</table></div><div class="entry-cards">${cards}</div>`:'<div class="empty">Ni zapisov za izbrane filtre.</div>'}
function openEntry(id){let x=entries.find(e=>e.id===id)||{};$('modalTitle').textContent=id?'Uredi zapis':'Dodaj zapis';$('modalBody').innerHTML=`<form id="entryForm" class="form-grid"><div class="field"><label>Uporabnik</label><select id="eUser" required>${profiles.map(p=>`<option value="${p.id}" ${p.id===x.user_id?'selected':''}>${esc(p.first_name+' '+p.last_name)}</option>`).join('')}</select></div><div class="field"><label>Vrsta</label><select id="eType">${['PRIHOD','ODHOD','DOPUST','BOLNISKA','NADURNO_DELO','SLUZBENA_POT','DRUGO'].map(v=>`<option ${v===x.entry_type?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Datum</label><input id="eDate" type="date" value="${x.entry_date||new Date().toLocaleDateString('en-CA')}" required></div><div class="field"><label>Čas</label><input id="eTime" type="time" value="${(x.entry_time||'').slice(0,5)}"></div><div class="field full"><label>Delovno mesto</label><select id="eLoc"><option value="">Brez lokacije</option>${locations.map(l=>`<option value="${l.id}" ${l.id===x.work_location_id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class="field full"><label>Opomba / razlog</label><textarea id="eNote" rows="3">${esc(x.note||'')}</textarea></div><div class="full"><button class="btn green">Shrani</button></div></form><div id="entryMsg" class="msg"></div>`;$('modal').classList.remove('hidden');$('entryForm').onsubmit=async e=>{e.preventDefault();try{let loc=locations.find(l=>l.id===$('eLoc').value),body={user_id:$('eUser').value,entry_type:$('eType').value,entry_date:$('eDate').value,entry_time:$('eTime').value||null,work_location_id:loc?.id||null,qr_location_name:loc?.name||null,note:$('eNote').value,source:'admin',updated_by:me.id,updated_at:new Date().toISOString()};if(id){await req('/rest/v1/time_entries?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}else{body.created_by=me.id;delete body.updated_by;delete body.updated_at;await req('/rest/v1/time_entries',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(body)})}await loadBase();$('modal').classList.add('hidden');entriesPage()}catch(z){$('entryMsg').className='msg error';$('entryMsg').textContent=z.message}}}
window.editEntry=id=>openEntry(id);window.deleteEntry=async id=>{let reason=prompt('Razlog brisanja:','Admin brisanje');if(reason===null)return;await req('/rest/v1/time_entries?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({deleted:true,deleted_at:new Date().toISOString(),deleted_by:me.id,deletion_reason:reason})});await loadBase();entriesPage()}
function usersPage(){$('view').innerHTML=`<h1>Uporabniki</h1><div class="card"><p class="no-print">Prijavne uporabnike in gesla za demo trenutno dodajaš v Supabase Authentication. Tukaj upravljaš profile in vloge.</p><div class="table-wrap" style="display:block"><table><tr><th>Uporabniško ime</th><th>Ime in priimek</th><th>Delovno mesto</th><th>Vloga</th><th>Status</th></tr>${profiles.map(p=>`<tr><td>${esc(p.username)}</td><td>${esc(p.first_name+' '+p.last_name)}</td><td>${esc(p.job_title)}</td><td>${p.role}</td><td>${p.active?'Aktiven':'Neaktiven'}</td></tr>`).join('')}</table></div><div class="actions"><button class="btn amber" onclick="window.print()">Natisni</button></div></div>`}
function workHours(a){let by={};a.forEach(x=>(by[x.user_id+'|'+x.entry_date]??=[]).push(x));let sums={};Object.entries(by).forEach(([k,v])=>{let uid=k.split('|')[0];sums[uid]??={days:0,minutes:0,leave:0,sick:0,overtime:0};let ins=v.filter(x=>x.entry_type==='PRIHOD').sort((a,b)=>(a.entry_time||'').localeCompare(b.entry_time||'')),outs=v.filter(x=>x.entry_type==='ODHOD').sort((a,b)=>(a.entry_time||'').localeCompare(b.entry_time||''));if(ins[0]&&outs.at(-1)){let m=t=>{let [h,n]=t.slice(0,5).split(':').map(Number);return h*60+n};let d=Math.max(0,m(outs.at(-1).entry_time)-m(ins[0].entry_time));sums[uid].minutes+=d;sums[uid].days++}if(v.some(x=>x.entry_type==='DOPUST'))sums[uid].leave++;if(v.some(x=>x.entry_type==='BOLNISKA'))sums[uid].sick++});return sums}
function reports(){$('view').innerHTML=`<h1>Poročila</h1><div class="card">${filtersHtml()}<div class="actions no-print"><button id="makeReport" class="btn">Izdelaj poročilo</button><button class="btn amber" onclick="window.print()">Natisni</button></div><div id="reportOut"></div></div>`;$('makeReport').onclick=renderReport;renderReport()}
function renderReport(){let a=filtered(),s=workHours(a),rows=Object.entries(s).map(([uid,x])=>`<tr><td>${esc(profileName(uid))}</td><td>${x.days}</td><td>${Math.floor(x.minutes/60)}:${String(x.minutes%60).padStart(2,'0')}</td><td>${x.leave}</td><td>${x.sick}</td></tr>`).join('');$('reportOut').innerHTML=`<div class="print-title"><h2>MACO Poročilo ur</h2></div><div class="report-summary"><div>Zapisi: <b>${a.length}</b></div><div>Prihodi: <b>${a.filter(x=>x.entry_type==='PRIHOD').length}</b></div><div>Dopusti: <b>${a.filter(x=>x.entry_type==='DOPUST').length}</b></div><div>Bolniške: <b>${a.filter(x=>x.entry_type==='BOLNISKA').length}</b></div></div><div class="table-wrap" style="display:block"><table style="min-width:600px"><tr><th>Uporabnik</th><th>Delovni dnevi</th><th>Skupaj ur</th><th>Dopust dni</th><th>Bolniška dni</th></tr>${rows}</table></div>`}
async function audit(){let a=await req('/rest/v1/audit_log?select=*&order=changed_at.desc&limit=300');$('view').innerHTML=`<h1>Sledljivost</h1><div class="card"><div class="actions no-print"><button class="btn amber" onclick="window.print()">Natisni</button></div><div class="table-wrap" style="display:block"><table><tr><th>Datum in čas</th><th>Dejanje</th><th>Tabela</th><th>Zapis</th></tr>${a.map(x=>`<tr><td>${new Date(x.changed_at).toLocaleString('sl-SI')}</td><td>${x.action}</td><td>${x.table_name}</td><td>${esc(x.record_id)}</td></tr>`).join('')}</table></div></div>`}
$('loginForm').onsubmit=login;$('menuBtn').onclick=()=>$('shell').classList.toggle('menu-open');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));$('logoutBtn').onclick=()=>location.reload();$('closeModal').onclick=()=>$('modal').classList.add('hidden');
})();
</script></body></html>
