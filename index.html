<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TeamMate Evidenca časa v2</title>
<style id="tm-reg-v101-clean">
:root{--blue:#0866ff;--navy:#102541;--bg:#f3f7fc;--card:#fff;--line:#d8e4f2;--muted:#6d8099;--ok:#159455;--danger:#dc3035;--shadow:0 12px 32px rgba(16,37,65,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--navy)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.shell{width:100%;max-width:760px;margin:0 auto;min-height:100dvh;padding:16px}.sub{color:var(--muted);font-size:12px}.appVersion{font-size:9px;font-weight:900;letter-spacing:.16em;color:#8092aa;text-align:center;margin:8px 0}.appVersionHead{text-align:left;margin:3px 0 0;font-size:8px}
.login{min-height:calc(100dvh - 32px);display:flex;flex-direction:column;justify-content:center;align-items:center}.tm-login-logo{width:190px;height:76px;margin:0 auto 12px}.tm-login-logo img{width:100%;height:100%;object-fit:contain;display:block}.login h2{font-size:25px;line-height:1.1;margin:0 0 4px;text-align:center}.login>p.sub{margin:0 0 6px;text-align:center}.login form{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}.field label{font-size:12px;font-weight:800;color:#506987}.field input,.field select{width:100%;height:46px;padding:0 13px;border:1px solid #c9d8eb;border-radius:11px;background:#fff;color:var(--navy);outline:none}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,102,255,.10)}.remember{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#526b87;margin:2px 0 14px}.remember input{width:18px;height:18px;accent-color:var(--blue)}
.btn{border:0;border-radius:11px;min-height:42px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}.btn.wide{width:100%}.btn.secondary{background:#eef4fb;color:var(--navy);border:1px solid var(--line)}.btn.danger{background:var(--danger)}.login form>p.sub{display:none}
#appView{min-height:calc(100dvh - 32px)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 12px;margin-bottom:10px}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:84px;height:36px;flex:0 0 84px;background:transparent!important;border-radius:0!important}.logo img{display:block;width:100%;height:100%;object-fit:contain}.brandtitle{font-size:15px;font-weight:900;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 7px 22px rgba(16,37,65,.055);margin-bottom:10px}.homeHero,.hero{background:#fff!important;color:var(--navy)!important}.clock,.bigtime{font-size:30px;font-weight:950;line-height:1}.username,.name{font-weight:900;font-size:17px}.grid,.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip,.mini{background:#eef5fd!important;color:var(--navy)!important;border:1px solid #dfeafa!important;border-radius:10px!important;padding:8px!important}.success,.okbox{background:#e9f8f0!important;color:#16643e!important;border:1px solid #cdebd9!important}.warn{color:#9a6300}.err{color:#a52c34}
.actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actionGrid .btn,.regbtn{min-height:58px}.regbtn.in,.btn.in{background:var(--blue)!important}.regbtn.out,.btn.out{background:#fff!important;color:var(--blue)!important;border:1px solid #a9caff!important}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:sticky;bottom:8px;background:rgba(243,247,252,.96);padding:7px;border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(12px)}.nav button{border:0;background:transparent;color:#566b85;border-radius:9px;padding:8px 4px;font-size:11px}.nav button.active{background:#e6f0ff;color:#075dcc;font-weight:850}
.overlay{position:fixed;inset:0;background:rgba(16,37,65,.42);display:grid;place-items:center;padding:18px;z-index:100}.modal{width:min(520px,100%);max-height:86dvh;overflow:auto;background:#fff;border-radius:18px;padding:18px;border:1px solid var(--line);box-shadow:0 22px 70px rgba(16,37,65,.2)}.actions{display:flex;gap:8px;justify-content:flex-end}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;z-index:200}
@media(max-width:600px){.shell{max-width:460px;padding:10px}.login{min-height:calc(100dvh - 20px)}.tm-login-logo{width:170px;height:66px}.login form{max-width:100%;padding:17px}.top{border-radius:13px}.card{border-radius:14px}.logo{width:74px;height:32px;flex-basis:74px}}

/* REG V1.05 MOBILE: header logo and removal of decorative bottom indicator */
body>.dot,.shell>.dot,#loginView>.dot,#appView>.dot{display:none}
#brandLogo.logo{width:108px;height:42px;flex:0 0 108px;background:transparent;border-radius:0}
#brandLogo.logo img{display:block;width:100%;height:100%;object-fit:contain}

/* REG V1.05 MOBILE-FIRST */
html,body{min-width:320px}
.shell{width:100%;max-width:430px;min-height:100dvh;margin:0 auto;padding:12px}
.login{min-height:calc(100dvh - 24px);justify-content:center}
.tm-login-logo{width:190px;height:92px;margin:0 auto 8px;overflow:visible}
.tm-login-logo img{width:100%;height:100%;object-fit:contain;transform:scale(1.18);transform-origin:center}
.login h2{font-size:27px;margin:0 0 4px}.login>p.sub{font-size:13px;margin:0 0 5px}
.login form{width:100%;max-width:390px;padding:19px;border-radius:18px}
.field input,.field select{height:50px;font-size:16px}.login .btn{min-height:52px;font-size:16px}
#appView{width:100%;min-height:calc(100dvh - 24px)}
.top{padding:10px 11px}.logo,#brandLogo.logo{width:112px;height:43px;flex:0 0 112px}.logo img,#brandLogo.logo img{object-fit:contain;transform:scale(1.12)}
.card{padding:14px}.clock,.bigtime{font-size:32px}.username,.name{font-size:18px}
.actionGrid .btn,.regbtn{min-height:55px;font-size:15px}.nav button{min-height:44px}
@media (min-width:600px){.shell{max-width:680px;padding:18px}.login{min-height:calc(100dvh - 36px)}.tm-login-logo{width:220px;height:105px}.login form{max-width:430px;padding:22px}.top{padding:12px 14px}.card{padding:17px}.logo,#brandLogo.logo{width:126px;height:48px;flex-basis:126px}}
@media (min-width:900px){.shell{max-width:720px}}
</style>
